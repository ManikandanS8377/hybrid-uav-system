name: Build Drone Firmware

# Trigger only on pull request to main
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    # Require manual approval before executing the job
    permissions:
      contents: read

    steps:
    # 1️⃣ Checkout the main branch (ignore PR branch changes)
    - name: Checkout main branch
      uses: actions/checkout@v3
      with:
        ref: main   # Always use code from main branch

    # 2️⃣ Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3️⃣ Install PlatformIO
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    # 4️⃣ Build firmware
    - name: Build Drone Firmware for ESP32
      run: |
        cd Drone/espfc_custom
        platformio run -e esp32

    # 5️⃣ Upload firmware binaries
    - name: Upload Firmware
      uses: actions/upload-artifact@v3
      with:
        name: firmware
        path: Drone/espfc_custom/.pio/build/esp32/firmware*.bin